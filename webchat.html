<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WASU's bot - Dự Án STEM</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    
    <!-- Thư viện Marked.js để render Markdown -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    
    <!-- KaTeX cho công thức toán học -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js"></script>

    <style>
        body {
            background-color: #030712;
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(56, 189, 248, 0.08) 0%, transparent 70%),
                linear-gradient(rgba(56, 189, 248, 0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(56, 189, 248, 0.02) 1px, transparent 1px);
            background-size: 100% 100%, 20px 20px, 20px 20px;
        }

        .hologram-box {
            background: rgba(10, 15, 30, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(56, 189, 248, 0.3);
            box-shadow: 0 0 20px rgba(56, 189, 248, 0.2);
        }

        .send-btn {
            display: flex !important;
            align-items: center;
            justify-content: center;
            background-color: #38bdf8;
            color: #030712;
            width: 44px;
            height: 44px;
            border-radius: 12px;
            cursor: pointer;
            border: none;
            flex-shrink: 0;
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.4);
            transition: all 0.2s ease;
        }
        .send-btn:hover {
            background-color: #7dd3fc;
        }

        .typing-cursor::after {
            content: '▋';
            display: inline-block;
            animation: blink 1s infinite;
            color: #38bdf8;
            margin-left: 2px;
            font-size: 0.8em;
        }

        @keyframes blink {
            0%, 50% { opacity: 1; }
            51%, 100% { opacity: 0; }
        }

        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: rgba(3, 7, 18, 0.8); }
        ::-webkit-scrollbar-thumb { background: rgba(56, 189, 248, 0.4); border-radius: 2px; }
    </style>
</head>
<body class="text-sky-100 h-[100dvh] flex flex-col justify-between overflow-hidden">

    <!-- Header Hologram -->
    <header class="hologram-box p-3 sm:p-4 flex justify-between items-center shadow-lg z-10 border-t-0 border-x-0 shrink-0">
        <div>
            <h1 class="text-base sm:text-xl font-extrabold text-sky-400 tracking-wider flex items-center gap-2">
                <span class="inline-block w-2.5 h-2.5 rounded-full bg-sky-400 animate-pulse shadow-[0_0_10px_#38bdf8]"></span>
                WASU'S BOT <span class="text-[10px] sm:text-xs px-1.5 py-0.5 rounded border border-sky-500/50 text-sky-300 bg-sky-950/50">MOBILE v2.6</span>
            </h1>
            <p class="hidden sm:block text-xs text-sky-400/60 font-mono mt-0.5">SYS_CREDIT: Nguyễn Anh Khoa | Phím tắt: Ctrl+/ (Focus), Ctrl+L (Xóa bộ nhớ)</p>
        </div>
        <div class="flex items-center gap-2">
            <button onclick="clearHistory()" class="bg-red-950/60 border border-red-500/50 hover:bg-red-900 text-red-300 px-2.5 py-1.5 sm:px-3 rounded-lg text-xs font-mono transition shadow-[0_0_10px_rgba(239,68,68,0.2)]">Xóa bộ nhớ</button>
            <span class="hidden md:inline-block bg-sky-950/80 border border-sky-400/60 text-sky-300 px-3 py-1.5 rounded-lg text-xs font-mono font-bold shadow-[0_0_10px_rgba(56,189,248,0.3)]">GPT-OSS-120B</span>
        </div>
    </header>

    <!-- Chat Container -->
    <div id="chat-container" class="flex-1 overflow-y-auto p-3 sm:p-4 space-y-3 sm:space-y-4 max-w-4xl w-full mx-auto">
        <div class="flex items-start gap-2.5 sm:gap-3">
            <div class="bg-sky-500 text-slate-950 rounded-lg w-7 h-7 sm:w-8 sm:h-8 flex items-center justify-center font-mono font-bold text-xs sm:text-sm shrink-0 shadow-[0_0_10px_#38bdf8]">AI</div>
            <div class="hologram-box p-3 sm:p-4 rounded-2xl max-w-[88%] sm:max-w-[85%] text-xs sm:text-sm leading-relaxed text-sky-200">
                Xin chào, tôi có thể giúp gì cho cậu? Cậu có thể chat hoặc đính kèm file Word/Excel để tôi phân tích nhé!
            </div>
        </div>
    </div>

    <!-- Input Area Hologram -->
    <div class="hologram-box p-3 sm:p-4 shadow-2xl border-b-0 border-x-0 shrink-0">
        <div class="max-w-4xl mx-auto flex flex-col gap-2">
            <!-- Hiển thị tên file đang đính kèm (nếu có) -->
            <div id="file-indicator" class="hidden items-center justify-between bg-sky-950/60 border border-sky-500/40 px-3 py-1 rounded-lg text-xs font-mono text-sky-300">
                <span id="file-name-display" class="truncate">Đã chọn file</span>
                <button onclick="removeAttachedFile()" class="text-red-400 hover:text-red-300 ml-2 font-bold">✕ Xóa</button>
            </div>

            <div class="flex gap-2 sm:gap-3 items-center">
                <!-- Nút đính kèm file Word / Excel -->
                <label for="file-upload" class="cursor-pointer bg-slate-950/80 border border-sky-500/40 hover:border-sky-400 text-sky-400 p-2.5 sm:p-3 rounded-xl flex items-center justify-center transition shadow-[0_0_10px_rgba(56,189,248,0.1)]" title="Đính kèm file Word hoặc Excel">
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M15.172 7l-6.586 6.586a2 2 0 102.828 2.828l6.414-6.586a4 4 0 00-5.656-5.656l-6.415 6.585a6 6 0 108.486 8.486L20.5 13" />
                    </svg>
                </label>
                <input type="file" id="file-upload" class="hidden" accept=".docx,.xlsx,.xls" onchange="handleFileSelect(event)">

                <textarea id="user-input" rows="1" placeholder="" 
                    class="flex-1 bg-slate-950/80 border border-sky-500/40 focus:border-sky-400 rounded-xl px-3.5 py-2.5 sm:px-4 sm:py-3 text-[16px] sm:text-sm text-sky-200 placeholder-sky-600/70 resize-none focus:outline-none focus:shadow-[0_0_15px_rgba(56,189,248,0.3)] transition font-mono"></textarea>
                
                <!-- Nút gửi tin nhắn -->
                <button onclick="sendMessage()" aria-label="Gửi tin nhắn" class="send-btn">
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 sm:w-6 sm:h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M5 10l7-7m0 0l7 7m-7-7v18" />
                    </svg>
                </button>
            </div>
        </div>
    </div>

    <script>
        let conversationHistory = [];
        let selectedFile = null;

        const randomPlaceholders = [
            "Hãy kể hôm nay của cậu thế nào?",
            "Cậu muốn hỏi gì?",
            "Hãy hỏi những gì cậu muốn thực hiện?",
            "Hôm nay chúng ta sẽ giải quyết bài toán nào nhỉ?",
            "Cậu cần tìm ý tưởng hay viết mã lệnh gì nào?",
            "Cứ thoải mái chia sẻ, tôi đang nghe đây!"
        ];

        function setRandomPlaceholder() {
            const inputField = document.getElementById('user-input');
            const randomIndex = Math.floor(Math.random() * randomPlaceholders.length);
            if (window.innerWidth < 640) {
                inputField.placeholder = randomPlaceholders[randomIndex];
            } else {
                inputField.placeholder = randomPlaceholders[randomIndex] + " (Enter gửi, Esc xóa, Ctrl+/ focus)";
            }
        }

        window.onload = function() {
            setRandomPlaceholder();
            const saved = localStorage.getItem('wasu_chat_history');
            if (saved) {
                conversationHistory = JSON.parse(saved);
                conversationHistory.forEach(msg => {
                    if (msg.role !== 'system') {
                        appendMessageToDOM(msg.content, msg.role === 'user' ? 'user' : 'ai', false);
                    }
                });
            }
            if (window.innerWidth >= 640) {
                document.getElementById('user-input').focus();
            }
        };

        function saveHistory() {
            localStorage.setItem('wasu_chat_history', JSON.stringify(conversationHistory));
        }

        function clearHistory() {
            localStorage.removeItem('wasu_chat_history');
            conversationHistory = [];
            setRandomPlaceholder();
            document.getElementById('chat-container').innerHTML = `
                <div class="flex items-start gap-2.5 sm:gap-3">
                    <div class="bg-sky-500 text-slate-950 rounded-lg w-7 h-7 sm:w-8 sm:h-8 flex items-center justify-center font-mono font-bold text-xs sm:text-sm shrink-0 shadow-[0_0_10px_#38bdf8]">AI</div>
                    <div class="hologram-box p-3 sm:p-4 rounded-2xl max-w-[88%] sm:max-w-[85%] text-xs sm:text-sm leading-relaxed text-sky-200">
                        Xin chào, bộ nhớ đã được làm sạch. Tôi có thể giúp gì tiếp theo cho cậu?
                    </div>
                </div>
            `;
        }

        function handleFileSelect(event) {
            const file = event.target.files[0];
            if (file) {
                selectedFile = file;
                document.getElementById('file-name-display').innerText = `📄 Đã đính kèm: ${file.name}`;
                document.getElementById('file-indicator').style.display = 'flex';
            }
        }

        function removeAttachedFile() {
            selectedFile = null;
            document.getElementById('file-upload').value = '';
            document.getElementById('file-indicator').style.display = 'none';
        }

        function renderMathInContainer(element) {
            if (window.renderMathInElement) {
                renderMathInElement(element, {
                    delimiters: [
                        {left: '$$', right: '$$', display: true},
                        {left: '$', right: '$', display: false},
                        {left: '\\(', right: '\\)', display: false},
                        {left: '[', right: ']', display: true}
                    ],
                    throwOnError: false
                });
            }
        }

        function appendMessageToDOM(text, sender, animate = false) {
            const container = document.getElementById('chat-container');
            const wrapper = document.createElement('div');
            wrapper.className = `flex items-start gap-2.5 sm:gap-3 ${sender === 'user' ? 'flex-row-reverse' : ''}`;

            const avatar = document.createElement('div');
            avatar.className = `rounded-lg w-7 h-7 sm:w-8 sm:h-8 flex items-center justify-center font-mono font-bold text-xs sm:text-sm shrink-0 shadow-md ${sender === 'user' ? 'bg-sky-400 text-slate-950' : 'bg-sky-500 text-slate-950 shadow-[0_0_10px_#38bdf8]'}`;
            avatar.innerText = sender === 'user' ? 'ME' : 'AI';

            const bubble = document.createElement('div');
            bubble.className = `p-3 sm:p-4 rounded-2xl max-w-[88%] sm:max-w-[85%] text-xs sm:text-sm leading-relaxed ${sender === 'user' ? 'bg-sky-600 text-white shadow-[0_0_15px_rgba(56,189,248,0.3)]' : 'hologram-box text-sky-100'}`;

            if (sender === 'ai') {
                if (animate) {
                    bubble.classList.add('typing-cursor');
                    let i = 0;
                    const speed = 8;
                    function typeWriter() {
                        if (i < text.length) {
                            bubble.innerHTML = marked.parse(text.substring(0, i + 1));
                            renderMathInContainer(bubble);
                            container.scrollTop = container.scrollHeight;
                            i += Math.max(1, Math.floor(text.length / 150));
                            setTimeout(typeWriter, speed);
                        } else {
                            bubble.classList.remove('typing-cursor');
                            finalizeAiBubble(bubble, text);
                        }
                    }
                    typeWriter();
                } else {
                    bubble.innerHTML = marked.parse(text);
                    renderMathInContainer(bubble);
                    appendExportButtons(bubble, text);
                }
            } else {
                bubble.innerText = text;
            }

            wrapper.appendChild(avatar);
            wrapper.appendChild(bubble);
            container.appendChild(wrapper);
            container.scrollTop = container.scrollHeight;
        }

        function finalizeAiBubble(bubble, text) {
            bubble.innerHTML = marked.parse(text);
            renderMathInContainer(bubble);
            appendExportButtons(bubble, text);
        }

        // Thêm nút tải file Word và Excel dưới câu trả lời của AI
        function appendExportButtons(bubble, text) {
            // Tránh chèn trùng lặp nút nếu render lại
            if (bubble.querySelector('.export-actions')) return;

            const actionsDiv = document.createElement('div');
            actionsDiv.className = 'export-actions mt-3 pt-2 border-t border-sky-500/20 flex gap-2 items-center';
            actionsDiv.innerHTML = `
                <span class="text-[10px] text-sky-400/70 font-mono">Xuất file:</span>
                <button onclick="exportFile('word', this)" class="bg-blue-950/80 hover:bg-blue-900 border border-blue-500/40 text-blue-200 px-2.5 py-1 rounded text-[11px] font-mono transition shadow-[0_0_5px_rgba(59,130,246,0.2)]">📄 Word</button>
                <button onclick="exportFile('excel', this)" class="bg-emerald-950/80 hover:bg-emerald-900 border border-emerald-500/40 text-emerald-200 px-2.5 py-1 rounded text-[11px] font-mono transition shadow-[0_0_5px_rgba(16,185,129,0.2)]">📊 Excel</button>
            `;
            // Lưu nội dung text nguyên bản vào dataset của nút để truyền đi
            actionsDiv.dataset.content = text;
            bubble.appendChild(actionsDiv);
        }

        async function exportFile(type, btnElement) {
            const content = btnElement.closest('.export-actions').dataset.content;
            const url = type === 'word' ? '/api/export/word' : '/api/export/excel';
            
            try {
                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ content: content })
                });
                
                if (!response.ok) throw new Error('Không thể tạo file từ máy chủ');
                
                const blob = await response.blob();
                const downloadUrl = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = downloadUrl;
                a.download = type === 'word' ? 'wasu_bao_cao.docx' : 'wasu_du_lieu.xlsx';
                document.body.appendChild(a);
                a.click();
                a.remove();
            } catch (error) {
                alert('Lỗi xuất file: ' + error.message);
            }
        }

        function appendLoading() {
            const container = document.getElementById('chat-container');
            const id = 'loading-' + Date.now();
            const wrapper = document.createElement('div');
            wrapper.id = id;
            wrapper.className = 'flex items-start gap-2.5 sm:gap-3';
            wrapper.innerHTML = `
                <div class="bg-sky-500 text-slate-950 rounded-lg w-7 h-7 sm:w-8 sm:h-8 flex items-center justify-center font-mono font-bold text-xs sm:text-sm shrink-0 shadow-[0_0_10px_#38bdf8]">AI</div>
                <div class="hologram-box p-3 rounded-2xl text-[11px] sm:text-xs font-mono text-sky-400 animate-pulse">Đang xử lý luồng dữ liệu quantum...</div>
            `;
            container.appendChild(wrapper);
            container.scrollTop = container.scrollHeight;
            return id;
        }

        async function sendMessage() {
            const input = document.getElementById('user-input');
            const text = input.value.trim();
            if (!text && !selectedFile) return;

            const displayMessage = text + (selectedFile ? `\n[Đã đính kèm file: ${selectedFile.name}]` : '');
            
            input.value = '';
            appendMessageToDOM(displayMessage, 'user', false);
            
            if (!selectedFile) {
                conversationHistory.push({ role: "user", content: text });
                saveHistory();
            }

            const loadingId = appendLoading();

            try {
                let response;
                if (selectedFile) {
                    const formData = new FormData();
                    formData.append('message', text);
                    formData.append('file', selectedFile);

                    response = await fetch('/api/chat', {
                        method: 'POST',
                        body: formData
                    });
                    
                    // Xóa file sau khi gửi thành công
                    removeAttachedFile();
                } else {
                    response = await fetch('/api/chat', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ messages: conversationHistory })
                    });
                }

                const data = await response.json();
                document.getElementById(loadingId)?.remove();

                const botReply = data.reply || 'Không có phản hồi từ máy chủ.';
                appendMessageToDOM(botReply, 'ai', true);
                
                conversationHistory.push({ role: "assistant", content: botReply });
                saveHistory();

            } catch (error) {
                document.getElementById(loadingId)?.remove();
                appendMessageToDOM('Lỗi kết nối tới máy chủ Flask!', 'ai', false);
            }
        }

        const inputField = document.getElementById('user-input');
        
        inputField.addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            } else if (e.key === 'Escape') {
                e.preventDefault();
                inputField.value = '';
            }
        });

        document.addEventListener('keydown', function(e) {
            if (e.ctrlKey && e.key.toLowerCase() === 'l') {
                e.preventDefault();
                clearHistory();
            } else if (e.ctrlKey && e.key === '/') {
                e.preventDefault();
                inputField.focus();
            }
        });
    </script>
</body>
</html>
