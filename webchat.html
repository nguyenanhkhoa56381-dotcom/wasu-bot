<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WASU's bot - Dự Án STEM</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- Thư viện Marked.js chuẩn để render Markdown và công thức đẹp mắt -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        body {
            background-color: #000000;
        }
        .neon-border {
            border: 1px solid #38bdf8;
            box-shadow: 0 0 12px rgba(56, 189, 248, 0.3);
        }
        .neon-border-subtle {
            border: 1px solid rgba(56, 189, 248, 0.4);
            box-shadow: 0 0 8px rgba(56, 189, 248, 0.15);
        }
        .typing-cursor::after {
            content: "▋";
            display: inline-block;
            animation: blink 1s infinite;
            color: #38bdf8;
            margin-left: 2px;
        }
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #000000;
        }
        ::-webkit-scrollbar-thumb {
            background: #0284c7;
            border-radius: 3px;
        }
        /* Tinh chỉnh style bên trong bong bóng chat cho gọn gàng */
        .message-content p {
            margin-bottom: 0.5rem;
        }
        .message-content p:last-child {
            margin-bottom: 0;
        }
        .message-content ul, .message-content ol {
            margin-left: 1.25rem;
            margin-bottom: 0.5rem;
        }
        .message-content ul { list-style-type: disc; }
        .message-content ol { list-style-type: decimal; }
        .message-content table {
            width: 100%;
            margin-top: 0.5rem;
            margin-bottom: 0.5rem;
            border-collapse: collapse;
        }
        .message-content th, .message-content td {
            border: 1px solid rgba(56, 189, 248, 0.3);
            padding: 0.375rem 0.75rem;
            text-align: left;
        }
        .message-content th {
            background-color: rgba(56, 189, 248, 0.1);
        }
    </style>
</head>
<body class="bg-black text-white h-screen flex flex-col font-sans overflow-hidden">

    <!-- Header -->
    <header class="bg-black border-b border-sky-500/40 px-6 py-4 flex items-center justify-between shadow-lg shadow-sky-950/20 shrink-0">
        <div class="flex items-center space-x-3">
            <div class="w-3 h-3 bg-sky-400 rounded-full animate-ping"></div>
            <div>
                <h1 class="text-lg font-bold tracking-wide text-sky-300">WASU's bot</h1>
                <p class="text-xs text-sky-400/70">Credit: Nguyễn Anh Khoa</p>
            </div>
        </div>
        <div class="flex items-center space-x-3">
            <button onclick="clearChatHistory()" class="text-xs bg-red-600/80 hover:bg-red-600 text-white px-3 py-1.5 rounded-lg transition cursor-pointer shadow">
                Xóa lịch sử
            </button>
            <span class="text-xs text-sky-300 bg-sky-950/80 border border-sky-500/50 px-3 py-1 rounded-full hidden sm:inline-block">GPT-OSS-120B</span>
        </div>
    </header>

    <!-- Chat Container -->
    <main id="chat-container" class="flex-1 overflow-y-auto p-4 md:p-6 space-y-6 max-w-4xl w-full mx-auto flex flex-col">
        <!-- Tin nhắn render tự động -->
    </main>

    <!-- Input Area -->
    <footer class="bg-black border-t border-sky-500/40 p-4 shadow-2xl shrink-0">
        <div class="max-w-4xl mx-auto flex items-end space-x-3">
            <textarea 
                id="user-input" 
                rows="1"
                placeholder="Nhập tin nhắn của bạn (Enter để gửi, Shift + Enter xuống dòng)..." 
                class="flex-1 bg-black text-white placeholder-sky-400/50 neon-border-subtle rounded-xl px-4 py-3 focus:outline-none focus:border-sky-400 focus:shadow-[0_0_12px_rgba(56,189,248,0.4)] resize-none max-h-32 transition"
            ></textarea>
            <button 
                id="send-btn" 
                onclick="sendMessage()"
                class="bg-sky-600 hover:bg-sky-500 text-white font-medium px-6 py-3 rounded-xl transition shadow-[0_0_10px_rgba(2,132,199,0.5)] flex items-center justify-center cursor-pointer"
            >
                Gửi
            </button>
        </div>
    </footer>

    <!-- JavaScript Xử lý logic -->
    <script>
        const chatContainer = document.getElementById('chat-container');
        const userInput = document.getElementById('user-input');

        let conversationHistory = [];

        try {
            const saved = localStorage.getItem('wasu_chat_history');
            if (saved) {
                conversationHistory = JSON.parse(saved);
            }
        } catch (e) {
            conversationHistory = [];
        }

        if (!Array.isArray(conversationHistory) || conversationHistory.length === 0) {
            conversationHistory = [{
                role: "assistant", 
                content: "Xin chào! Tôi là WASU's bot, sẵn sàng hỗ trợ bạn thực hiện dự án STEM, viết code hoặc giải đáp mọi thắc mắc. Hãy nhập câu hỏi bên dưới nhé!"
            }];
            saveHistory();
        }

        renderHistory();

        userInput.addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = (this.scrollHeight) + 'px';
        });

        userInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        async function sendMessage() {
            const text = userInput.value.trim();
            if (!text) return;

            userInput.value = '';
            userInput.style.height = 'auto';

            conversationHistory.push({ role: "user", content: text });
            appendMessage(text, 'user');
            saveHistory();

            const loadingId = 'loading-' + Date.now();
            appendLoadingMessage(loadingId);

            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ messages: conversationHistory })
                });

                const data = await response.json();
                const loadingElement = document.getElementById(loadingId);
                if (loadingElement) loadingElement.remove();

                const botReply = data.reply || 'Không có phản hồi từ máy chủ.';

                conversationHistory.push({ role: "assistant", content: botReply });
                saveHistory();

                appendTypingMessage(botReply);

            } catch (error) {
                const loadingElement = document.getElementById(loadingId);
                if (loadingElement) loadingElement.remove();
                appendMessage('Lỗi kết nối tới máy chủ Flask!', 'bot');
            }
        }

        function renderHistory() {
            chatContainer.innerHTML = '';
            conversationHistory.forEach(msg => {
                const sender = msg.role === 'user' ? 'user' : 'bot';
                appendMessageNode(msg.content, sender);
            });
            scrollToBottom();
        }

        function appendMessageNode(text, sender) {
            const isUser = sender === 'user';
            const messageDiv = document.createElement('div');
            // Dùng max-w-[90%] và để fit nội dung tốt hơn, chống tràn
            messageDiv.className = `flex items-start space-x-3 my-2 w-full ${isUser ? 'flex-row-reverse space-x-reverse' : ''}`;
            
            // Xử lý render Markdown cho bot, user thì giữ nguyên text thường để tránh lỗi ký tự
            const renderedContent = isUser ? text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/\n/g, "<br>") : marked.parse(text);

            messageDiv.innerHTML = `
                <div class="w-9 h-9 shrink-0 rounded-full ${isUser ? 'bg-sky-600 shadow-[0_0_8px_rgba(2,132,199,0.8)]' : 'bg-slate-900 border border-sky-400 shadow-[0_0_8px_rgba(56,189,248,0.5)]'} flex items-center justify-center font-bold text-white text-sm">
                    ${isUser ? 'Bạn' : 'AI'}
                </div>
                <div class="${isUser ? 'bg-sky-950 border border-sky-400/80 text-white shadow-[0_0_10px_rgba(56,189,248,0.2)]' : 'bg-black border border-sky-500/50 shadow-[0_0_12px_rgba(56,189,248,0.25)] text-sky-100'} rounded-2xl px-5 py-3.5 max-w-[85%] md:max-w-[75%] leading-relaxed overflow-hidden message-content">
                    ${renderedContent}
                </div>
            `;
            chatContainer.appendChild(messageDiv);
        }

        function appendMessage(text, sender) {
            appendMessageNode(text, sender);
            scrollToBottom();
        }

        function appendLoadingMessage(id) {
            const loadingDiv = document.createElement('div');
            loadingDiv.id = id;
            loadingDiv.className = 'flex items-start space-x-3 my-2 w-full';
            loadingDiv.innerHTML = `
                <div class="w-9 h-9 shrink-0 rounded-full bg-black border border-sky-400 shadow-[0_0_8px_rgba(56,189,248,0.5)] flex items-center justify-center font-bold text-white text-sm">AI</div>
                <div class="bg-black border border-sky-500/50 rounded-2xl px-5 py-4 shadow-[0_0_12px_rgba(56,189,248,0.25)] flex items-center space-x-2">
                    <div class="w-2 h-2 bg-sky-400 rounded-full animate-bounce shadow-[0_0_6px_#38bdf8]"></div>
                    <div class="w-2 h-2 bg-sky-400 rounded-full animate-bounce [animation-delay:0.2s] shadow-[0_0_6px_#38bdf8]"></div>
                    <div class="w-2 h-2 bg-sky-400 rounded-full animate-bounce [animation-delay:0.4s] shadow-[0_0_6px_#38bdf8]"></div>
                </div>
            `;
            chatContainer.appendChild(loadingDiv);
            scrollToBottom();
        }

        function appendTypingMessage(fullText) {
            const messageDiv = document.createElement('div');
            messageDiv.className = 'flex items-start space-x-3 my-2 w-full';
            
            const contentId = 'content-' + Date.now();
            messageDiv.innerHTML = `
                <div class="w-9 h-9 shrink-0 rounded-full bg-black border border-sky-400 shadow-[0_0_8px_rgba(56,189,248,0.5)] flex items-center justify-center font-bold text-white text-sm">AI</div>
                <div class="bg-black border border-sky-500/50 rounded-2xl px-5 py-3.5 max-w-[85%] md:max-w-[75%] shadow-[0_0_12px_rgba(56,189,248,0.25)] text-sky-100 leading-relaxed typing-cursor overflow-hidden message-content" id="${contentId}"></div>
            `;
            chatContainer.appendChild(messageDiv);
            scrollToBottom();

            const textContainer = document.getElementById(contentId);
            let index = 0;
            const speed = 10;

            function typeWriter() {
                if (index < fullText.length) {
                    let currentSubstring = fullText.substring(0, index + 1);
                    textContainer.innerHTML = marked.parse(currentSubstring);
                    index++;
                    scrollToBottom();
                    setTimeout(typeWriter, speed);
                } else {
                    textContainer.classList.remove('typing-cursor');
                    textContainer.innerHTML = marked.parse(fullText);
                }
            }
            typeWriter();
        }

        function saveHistory() {
            localStorage.setItem('wasu_chat_history', JSON.stringify(conversationHistory));
        }

        function clearChatHistory() {
            if (confirm("Bạn có chắc chắn muốn xóa toàn bộ lịch sử trò chuyện không?")) {
                localStorage.removeItem('wasu_chat_history');
                conversationHistory = [{
                    role: "assistant", 
                    content: "Xin chào! Tôi là WASU's bot, sẵn sàng hỗ trợ bạn thực hiện dự án STEM, viết code hoặc giải đáp mọi thắc mắc. Hãy nhập câu hỏi bên dưới nhé!"
                }];
                saveHistory();
                renderHistory();
            }
        }

        function scrollToBottom() {
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }
    </script>
</body>
</html>
